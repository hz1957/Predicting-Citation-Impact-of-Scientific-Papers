<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Citation Impact">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b4f4b"/>
      <stop offset="1" stop-color="#0f6f6a"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- ascending bars = growing citation impact -->
  <rect x="6"  y="18" width="4.5" height="8"  rx="1.2" fill="#ffffff" opacity="0.92"/>
  <rect x="13.75" y="13" width="4.5" height="13" rx="1.2" fill="#ffffff" opacity="0.96"/>
  <rect x="21.5" y="7"  width="4.5" height="19" rx="1.2" fill="#ffffff"/>
</svg>
